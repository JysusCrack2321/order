[package]
name = "order-ffi"
version = "0.1.1"
license = "GPL-3.0-or-later"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
order-core = { path = "../order-core" }
order-p2p = { path = "../order-p2p" }
chrono = "0.4"
uniffi = "0.32.2"

[dev-dependencies]
tempfile = "3"
