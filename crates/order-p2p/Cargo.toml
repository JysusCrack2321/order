[package]
name = "order-p2p"
version = "0.1.0"
license = "GPL-3.0-or-later"
edition = "2024"

[dependencies]
order-core = { path = "../order-core" }
chrono = { version = "0.4", features = ["serde"] }
futures-core = "0.3"
iroh = "1.5"
iroh-mdns-address-lookup = "0.6"
qrcode = { version = "0.15", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "io-util", "macros"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
