[package]
name = "order-core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
ureq = { version = "3", features = ["json"] }
base64 = "0.22"
pdf-extract = "0.12"

[dev-dependencies]
tempfile = "3"
