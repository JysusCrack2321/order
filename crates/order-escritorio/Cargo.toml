[package]
name = "order-escritorio"
version = "0.1.1"
edition = "2024"
authors = ["JysusCrack2321 <jaragonb@unal.edu.co>"]
description = "Horario, tareas y recordatorios para organizarte en un solo binario"
license = "GPL-3.0-or-later"

[[bin]]
name = "order"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.19"

[dependencies]
order-core = { path = "../order-core" }
order-p2p = { path = "../order-p2p" }
chrono = { version = "0.4", features = ["serde"] }
slint = "1.19"
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
notify = "8"
notify-rust = "4"
png = "0.18"
cpal = "0.18"
hound = "3.5"
rfd = "0.18"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "0.6"
tempfile = "3"
whisper-rs = "0.16"

[dev-dependencies]
tempfile = "3"

[package.metadata.deb]
name = "order"
maintainer = "JysusCrack2321 <jaragonb@unal.edu.co>"
section = "utils"
priority = "optional"
depends = "$auto"
extended-description = """\
Aplicación de escritorio personal para Linux que muestra el horario \
de la semana, las tareas pendientes y los recordatorios, y avisa por \
notificaciones de escritorio en un solo binario."""
assets = [
    ["target/release/order", "usr/bin/", "755"],
    ["../../empaquetar/order.desktop", "usr/share/applications/order.desktop", "644"],
    ["arte/order.svg", "usr/share/icons/hicolor/scalable/apps/order.svg", "644"],
    ["arte/order-256.png", "usr/share/icons/hicolor/256x256/apps/order.png", "644"],
]
