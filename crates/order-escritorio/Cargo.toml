[package]
name = "order-escritorio"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "order"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.19"

[dependencies]
order-core = { path = "../order-core" }
chrono = { version = "0.4", features = ["serde"] }
slint = "1.19"
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
notify = "8"
notify-rust = "4"
png = "0.18"
cpal = "0.18"
hound = "3.5"
rfd = "0.18"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "0.6"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
