# Archivo de datos de ORDER
# ---------------------------------------------------------------------------
# Todo lo que hace la app vive en este archivo. Se puede editar a mano o con
# Hermes: la app lo relee sola cuando cambia.
#
# Formatos:
#   días    : lun mar mie jue vie sab dom
#   horas   : "HH:MM"                     (24 h, siempre entre comillas)
#   fechas  : "YYYY-MM-DD"
#   vence   : "YYYY-MM-DDTHH:MM"          (hora local)
#   id      : se puede omitir; la app lo asigna ("t-...", "c-...", "r-...")
# ---------------------------------------------------------------------------

# Cómo y cuándo avisar. Si falta esta sección se usan estos mismos valores.
[ajustes]
aviso_dia_antes = "20:00"   # hora del aviso del día anterior al vencimiento
aviso_horas_antes = 3       # aviso N horas antes de vencer

# Rango del semestre. Las clases solo se dibujan dentro de estas fechas.
# Si se borra esta sección, las clases aparecen todas las semanas.
[semestre]
inicio = "2026-08-03"
fin = "2026-12-05"

# Horario fijo de la semana. Se repite cada semana dentro del semestre.
[[clase]]
materia = "Control"
dia = "lun"
inicio = "07:00"
fin = "09:00"
lugar = "453-201"

[[clase]]
materia = "Robótica"
dia = "mar"
inicio = "09:00"
fin = "11:00"

[[clase]]
materia = "Control"
dia = "jue"
inicio = "07:00"
fin = "09:00"
lugar = "453-201"

# Tareas con fecha y hora de entrega.
[[tarea]]
id = "t-20261121-01"
titulo = "Taller 2"
materia = "Control"
vence = "2026-11-28T23:59"
hecha = false

[[tarea]]
titulo = "Informe de laboratorio"
materia = "Robótica"
vence = "2026-12-02T18:00"
hecha = false

# Recordatorios fijos: se avisan los días indicados a la hora indicada.
[[recordatorio]]
texto = "Revisar Moodle"
dias = ["lun", "mar", "mie", "jue", "vie"]
hora = "18:00"

[[recordatorio]]
texto = "Revisar Classroom"
dias = ["mie"]
hora = "20:00"
